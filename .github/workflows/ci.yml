name: CI

on:
  push:
    branches: [ main, master, feature-branch ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Go Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: |
          cd backend
          go mod tidy

      - name: Build Go Backend
        run: |
          cd backend
          go build -v ./...

  frontend:
    name: React Native Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Queue-care/package-lock.json

      - name: Install dependencies
        run: |
          cd Queue-care
          npm ci

      - name: Type check (TypeScript)
        run: |
          cd Queue-care
          npx tsc --noEmit
